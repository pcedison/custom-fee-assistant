# 後台 Worker：使用統計（只有自己看得到）
# Workers Builds 設定：Root directory 填 admin，部署指令用預設的 npx wrangler deploy
name = "custom-fee-admin"
main = "worker.js"
compatibility_date = "2026-09-01"

# 用 workers.dev 網址開啟，並在 Cloudflare 主控台開啟 Cloudflare Access（只允許自己的 Email）
workers_dev = true
# 不開預覽網址，避免出現沒有門禁的網址
preview_urls = false

[vars]
# Cloudflare Access（後台每次都會驗證 Access 的 JWT）
TEAM_DOMAIN = "weathered-glade-0f17.cloudflareaccess.com"
POLICY_AUD = "cce9431e5d31f8e980da17a8881a8bd1635fea604c5bc24e8b6d61243991c4c0"

# 和主站同一個 D1 資料庫（只讀取）
[[d1_databases]]
binding = "DB"
database_name = "custom-fee-stats"
database_id = "1261e515-3f10-4442-91b5-39796d1f0fe3"

[observability]
enabled = true
