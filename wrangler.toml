# Cloudflare Pages 設定（連結 GitHub 後自動套用）
name = "custom-fee-assistant"
pages_build_output_dir = "./public"
compatibility_date = "2026-09-01"

# Cloudflare Workers AI：免金鑰，直接用帳號的免費額度（每天 10,000 Neurons）
[ai]
binding = "AI"

[vars]
# 主要模型（便宜、中文能力好）；想換模型改這一行再推送即可
WORKERS_AI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
GEMINI_MODEL = "gemini-3.5-flash-lite"
