# Cloudflare Workers 設定（連結 GitHub 後，部署指令 npx wrangler deploy 會讀這個檔）
name = "custom-fee-assistant"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# 開啟 https://custom-fee-assistant.<子網域>.workers.dev 網址
workers_dev = true

# 網站本體（聊天介面、圖表）
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare Workers AI：免金鑰，直接用帳號的免費額度（每天 10,000 Neurons）
[ai]
binding = "AI"

[vars]
# 主要模型（便宜、中文能力好）；想換模型改這一行再推送即可
WORKERS_AI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
GEMINI_MODEL = "gemini-3.5-flash-lite"
# 語意分流（Workers AI 向量模型 bge-m3）：預寫答案只有在顧客問法夠像時才直接用，否則交給 AI
EMBED_MODEL = "@cf/baai/bge-m3"
ROUTE_SOFT = "0.70"     # 至少要這麼像「預寫答案答得到」的例句
ROUTE_MARGIN = "0.05"   # 而且要比「答不到」的例句高出這麼多，才用預寫答案
ROUTE_DEBUG = "1"       # 開放 GET /api/route 校正工具（只算相似度）；校正完可改成 "0" 關閉
# 使用統計：提問原句保留天數（過期只刪原句，統計數字保留）
STATS_TEXT_DAYS = "180"

# 使用統計資料庫（後台 custom-fee-admin 也連同一個）。建立 D1 後填入 database_id 再取消註解
# [[d1_databases]]
# binding = "DB"
# database_name = "custom-fee-stats"
# database_id = ""

# 每天台北時間 03:00（UTC 19:00）清理過期的原句
[triggers]
crons = ["0 19 * * *"]

[observability]
enabled = true
